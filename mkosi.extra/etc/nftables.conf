#!/usr/sbin/nft -f

flush ruleset

table inet confer {
  chain input {
    type filter hook input priority 0;
    policy drop;

    iifname "lo" accept
    ct state established,related accept
    ip protocol icmp accept
    tcp dport { 22, 8080 } accept
  }

  chain output {
    type filter hook output priority 0;
    policy drop;

    oifname "lo" meta skuid != confer-job accept
    ct state established,related accept

    udp sport 68 udp dport 67 accept
    ip daddr 169.254.169.254 udp dport 53 meta skuid root accept
    ip daddr 169.254.169.254 tcp dport 53 meta skuid root accept
    ip daddr 169.254.169.254 udp dport 53 meta skuid confer-job accept
    ip daddr 169.254.169.254 tcp dport 53 meta skuid confer-job accept
    ip daddr 169.254.169.254 udp dport 123 meta skuid root accept
    ip daddr 169.254.169.254 tcp dport 80 meta skuid root accept
    ip daddr 169.254.169.254 meta skuid confer-job reject with icmpx type admin-prohibited
    ip daddr 0.0.0.0 meta skuid confer-job reject with icmpx type admin-prohibited
    tcp dport 443 meta skuid confer-job accept
    meta skuid confer-job meta l4proto tcp reject with tcp reset
    meta skuid confer-job reject with icmpx type admin-prohibited
  }
}
