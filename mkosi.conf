[Config]
Dependencies=initrd
MinimumVersion=25.3

[Output]
ImageId=confer-worker-image
ImageVersion=0.1.1
OutputDirectory=mkosi.output
Format=disk
Seed=01379291-3258-40cc-bb5f-57a7a9c4db2e

[Distribution]
Distribution=ubuntu
Release=noble
Architecture=x86-64
Mirror=https://snapshot.ubuntu.com/ubuntu/20260209T000000Z
Repositories=

[Content]
SourceDateEpoch=0
Initrds=%O/initrd.cpio.zst
Bootable=yes
Bootloader=uki
KernelCommandLine=intel_iommu=on iommu=pt console=ttyS0
KernelModulesInitrdInclude=dm-verity
                          dm-mod
                          squashfs
                          nvme
                          gve

Packages=
    systemd
    systemd-boot-efi
    systemd-timesyncd
    udev
    dbus
    ca-certificates
    ubuntu-keyring
    cryptsetup
    kmod
    openssh-server
    bash
    file
    python3
    python3-pip
    python3-venv
    python3-docx
    python3-openpyxl
    python3-xlsxwriter
    python3-reportlab
    python3-pil
    python3-pypdf
    poppler-utils
    fontconfig
    fonts-dejavu-core
    fonts-liberation
    fonts-noto-core
    curl
    nftables
    linux-generic-hwe-24.04

Autologin=no
Locale=C.UTF-8
Keymap=us

RemoveFiles=/var/log/*
RemoveFiles=/var/cache
RemoveFiles=/root/.cache
RemoveFiles=/.cache
RemoveFiles=/tmp/*
RemoveFiles=/etc/*-
RemoveFiles=/etc/ssh/ssh_host_*_key*
CleanPackageMetadata=yes

[Build]
WithNetwork=yes
SandboxTrees=mkosi.skeleton
Environment=SOURCE_DATE_EPOCH=0
Environment=KBUILD_BUILD_TIMESTAMP=@0
Environment=INITRD=No
